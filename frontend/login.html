<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#b91c1c" />
<title>南孚在地营销 · 登录</title>
<link rel="stylesheet" href="/shared.css?v=5" />
<link rel="stylesheet" href="/style.css?v=5" />
<style>
  :root {
    --brand-grad: linear-gradient(135deg, #b91c1c 0%, #dc2626 50%, #ef4444 100%);
    --brand-grad-soft: linear-gradient(135deg, rgba(185,28,28,.08), rgba(239,68,68,.04));
  }
  /* 全屏沉浸背景：品牌色光晕 + 细密几何网格 */
  body {
    position: relative;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: var(--brand-grad-soft);
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(800px 480px at 88% 0%, rgba(185,28,28,.16) 0%, transparent 60%),
      radial-gradient(700px 460px at 0% 100%, rgba(239,68,68,.10) 0%, transparent 60%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .35;
    background-image: linear-gradient(rgba(185,28,28,.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(185,28,28,.06) 1px, transparent 1px);
    background-size: 32px 32px, 32px 32px;
    mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 75%);
  }
  .login-wrap { position: relative; z-index: 1; width: 100%; max-width: 440px; }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: 22px;
    padding: 36px 32px 28px;
    width: 100%;
    box-shadow: 0 30px 60px -20px rgba(185,28,28,.25), 0 8px 16px -4px rgba(0,0,0,.06);
    animation: riseIn .45s var(--ease-out);
  }
  .login-mark {
    width: 60px; height: 60px; border-radius: 16px; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center; color: #fff;
    background: var(--brand-grad);
    box-shadow: 0 10px 24px -6px rgba(185,28,28,.45);
    position: relative;
  }
  .login-mark::after {
    content: ""; position: absolute; inset: -4px; border-radius: 18px;
    background: var(--brand-grad); opacity: .25; z-index: -1;
    filter: blur(8px);
  }
  .login-mark .ic { width: 28px; height: 28px; }
  h1 { text-align: center; font-size: 22px; margin-bottom: 4px; color: var(--text); font-weight: 700; letter-spacing: -.02em; }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 22px; }
  /* 标签页：胶囊形 + 顶部小图标 */
  .tab-row {
    display: flex; gap: 6px; padding: 5px; margin-bottom: 22px;
    background: var(--surface-alt); border-radius: var(--radius-lg);
  }
  .tab-row button {
    flex: 1; height: 40px; border: none; background: none; font-size: 14px;
    cursor: pointer; color: var(--text-secondary); font-family: inherit;
    font-weight: 600; border-radius: var(--radius-sm); transition: all var(--transition);
  }
  .tab-row button:hover { color: var(--brand); }
  .tab-row button.active { background: var(--brand-grad); color: #fff; box-shadow: 0 4px 12px -3px rgba(185,28,28,.4); }
  /* 表单：上下结构，输入更醒目 */
  .login-box .form-group { margin-bottom: 14px; }
  .login-box .form-group label {
    display: block; font-size: 12px; color: var(--text-secondary);
    font-weight: 600; margin-bottom: 6px; letter-spacing: .02em;
  }
  .login-box input, .login-box select {
    width: 100%; height: 44px; padding: 0 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    background: var(--bg-soft, #fafafa);
    color: var(--text); font-size: 14px; font-family: inherit;
    transition: all .18s ease;
  }
  .login-box input:focus, .login-box select:focus {
    outline: none; border-color: var(--brand);
    background: #fff; box-shadow: 0 0 0 4px rgba(185,28,28,.08);
  }
  /* 错误信息：柔和红色背景条 */
  .error-msg {
    color: #991b1b; font-size: 13px; text-align: center;
    margin-top: 14px; min-height: 20px;
    background: rgba(185,28,28,.07);
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid rgba(185,28,28,.15);
  }
  .login-box .btn { width: 100%; height: 46px; font-size: 15px; }
  .hidden { display: none !important; }
  /* 底部小字：版权 + 品牌 */
  .login-footer {
    text-align: center; margin-top: 18px;
    color: var(--text-muted); font-size: 11px;
  }
  .login-footer .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    background: rgba(185,28,28,.08); color: var(--brand);
    font-weight: 600; font-size: 10px; margin-right: 6px;
    border: 1px solid rgba(185,28,28,.12);
  }
  /* 手机端：去掉网格 + 紧凑 padding */
  @media (max-width: 480px) {
    body { padding: 14px; }
    .login-box { padding: 28px 22px 22px; border-radius: 18px; }
    h1 { font-size: 20px; }
    .login-mark { width: 54px; height: 54px; }
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-mark">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="M9 12h6"/></svg>
    </div>
    <h1>南孚在地营销</h1>
    <p class="subtitle">内容审核 · 区域协作 · 智能分析</p>
    <!-- 登录表单（注册通道已关闭：账号统一由管理员在后台「账号管理 → 新增账号」创建） -->
    <form id="formLogin" onsubmit="doLogin(event)">
      <div class="form-group"><label>用户名</label><input type="text" id="loginUser" required autocomplete="username" placeholder="请输入用户名" /></div>
      <div class="form-group"><label>密码</label><input type="password" id="loginPwd" required autocomplete="current-password" placeholder="请输入密码" /></div>
      <button type="submit" class="btn btn-primary" id="btnLogin">登 录</button>
    </form>

    <div style="margin-top:14px;text-align:center;font-size:12px;color:var(--text-muted)">
      如需开通账号，请联系管理员
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="login-footer">
      <span class="badge">v2</span>南孚在地营销 · 内容合规监控平台
    </div>
  </div>
</div>

<script>
const API = (path, opts = {}) => fetch(path, { credentials: "same-origin", ...opts }).then(r => r.json().then(d => ({ ok: r.ok, status: r.status, data: d })));

// 注册通道已关闭：账号统一由管理员在后台「账号管理 → 新增账号」创建，
// 所以登录页不再拉区域列表、也没有注册表单。

function showError(msg) { document.getElementById("errorMsg").textContent = msg; }

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById("btnLogin");
  btn.disabled = true; btn.textContent = "登录中...";
  showError("");
  const { ok, data } = await API("/api/auth/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: document.getElementById("loginUser").value.trim(),
      password: document.getElementById("loginPwd").value,
    }),
  });
  if (ok && data.ok) {
    window.location.href = "/manager";
  } else {
    showError((data && data.detail) || "登录失败，请检查用户名和密码");
    btn.disabled = false; btn.textContent = "登 录";
  }
}
</script>
</body>
</html>
